<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <path id="textArcTop" d="M 60,200 A 140,140 0 1,1 340,200" fill="none"/>
    <path id="textArcBottom" d="M 340,200 A 140,140 0 0,1 60,200" fill="none"/>
  </defs>

  <!-- Outer Rubber Stamp Rings -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#003366" stroke-width="5" opacity="0.85"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#003366" stroke-width="2" opacity="0.85"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#003366" stroke-width="2" opacity="0.85"/>

  <!-- Top Text (Amharic) -->
  <text font-family="sans-serif" font-size="17" font-weight="bold" fill="#003366" letter-spacing="1.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      የአዲስ አበባ ከተማ አስተዳደር ፕላንና ልማት ቢሮ
    </textPath>
  </text>

  <!-- Bottom Text (English) -->
  <text font-family="sans-serif" font-size="13" font-weight="bold" fill="#003366" letter-spacing="1">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ADDIS ABABA PLAN &amp; DEVELOPMENT BUREAU
    </textPath>
  </text>

  <!-- Side Stars -->
  <text x="52" y="206" font-size="20" fill="#003366" text-anchor="middle">★</text>
  <text x="348" y="206" font-size="20" fill="#003366" text-anchor="middle">★</text>

  <!-- Center Content -->
  <g transform="translate(135, 135) scale(0.65)" opacity="0.9">
    <!-- City Building / Map Symbol -->
    <path d="M20 160 L20 80 L60 40 L100 80 L100 160 Z" fill="none" stroke="#003366" stroke-width="6"/>
    <rect x="35" y="90" width="15" height="20" fill="#003366"/>
    <rect x="70" y="90" width="15" height="20" fill="#003366"/>
    <rect x="35" y="125" width="15" height="25" fill="#003366"/>
    <rect x="70" y="125" width="15" height="25" fill="#003366"/>
    <path d="M110 160 L140 100 L170 160 Z" fill="none" stroke="#003366" stroke-width="6"/>
  </g>

  <!-- Approval Stamp Sub-Text -->
  <text x="200" y="245" font-family="sans-serif" font-weight="bold" font-size="14" fill="#003366" text-anchor="middle">ዋና መሥሪያ ቤት</text>
  <text x="200" y="265" font-family="sans-serif" font-weight="bold" font-size="12" fill="#003366" text-anchor="middle">HEAD OFFICE</text>
</svg>
