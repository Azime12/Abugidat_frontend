<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <defs>
    <!-- Oval text paths -->
    <path id="ellipseArcTop" d="M 60,170 A 200,110 0 1,1 460,170" fill="none"/>
    <path id="ellipseArcBottom" d="M 460,170 A 200,110 0 0,1 60,170" fill="none"/>
  </defs>

  <!-- Outer Rubber Oval Rings -->
  <ellipse cx="260" cy="170" rx="240" ry="140" fill="none" stroke="#002D62" stroke-width="6" stroke-dasharray="350 4 12 3" opacity="0.9"/>
  <ellipse cx="260" cy="170" rx="230" ry="130" fill="none" stroke="#002D62" stroke-width="2" opacity="0.85"/>
  <ellipse cx="260" cy="170" rx="160" ry="85" fill="none" stroke="#002D62" stroke-width="2" opacity="0.85"/>

  <!-- Top Curved Text (Amharic) -->
  <text font-family="sans-serif" font-size="18" font-weight="bold" fill="#002D62" letter-spacing="1">
    <textPath href="#ellipseArcTop" startOffset="50%" text-anchor="middle">
      የአዲስ አበባ ከተማ አስተዳደር ፕላንና ልማት ቢሮ
    </textPath>
  </text>

  <!-- Bottom Curved Text (English) -->
  <text font-family="sans-serif" font-size="13" font-weight="bold" fill="#002D62" letter-spacing="1">
    <textPath href="#ellipseArcBottom" startOffset="50%" text-anchor="middle">
      ADDIS ABABA PLAN AND DEVELOPMENT BUREAU
    </textPath>
  </text>

  <!-- Side Decorative Markers -->
  <text x="42" y="176" font-size="20" fill="#002D62" text-anchor="middle">◆</text>
  <text x="478" y="176" font-size="20" fill="#002D62" text-anchor="middle">◆</text>

  <!-- Center Content Block -->
  <text x="260" y="140" font-family="sans-serif" font-size="15" font-weight="bold" fill="#002D62" text-anchor="middle">
    የቴክኒክ መረጣና ፕላን ማረጋገጫ
  </text>
  <text x="260" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#002D62" text-anchor="middle">
    PLAN VERIFICATION &amp; APPROVAL
  </text>

  <line x1="140" y1="172" x2="380" y2="172" stroke="#002D62" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Form Fields -->
  <text x="150" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#002D62">ቀን / DATE:</text>
  <line x1="230" y1="197" x2="370" y2="197" stroke="#002D62" stroke-width="1.5" stroke-dasharray="2 2"/>

  <text x="150" y="220" font-family="sans-serif" font-size="13" font-weight="bold" fill="#002D62">ፊርማ / SIGN:</text>
  <line x1="230" y1="222" x2="370" y2="222" stroke="#002D62" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
